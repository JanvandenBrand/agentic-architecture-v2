name: Publish solution overview

on:
  push:
    branches: [main]
    paths:
      - agentic-architecture-v2.html
      - docs/compatibility.md
      - docs/troubleshooting.md
      - docs/release-process.md
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Prepare static site
        shell: bash
        run: |
          mkdir -p _site
          cp agentic-architecture-v2.html _site/index.html
          cp agentic-architecture-v2.html _site/agentic-architecture-v2.html
          mkdir -p _site/docs
          cp docs/compatibility.md _site/docs/compatibility.md
          cp docs/troubleshooting.md _site/docs/troubleshooting.md
          cp docs/release-process.md _site/docs/release-process.md

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
