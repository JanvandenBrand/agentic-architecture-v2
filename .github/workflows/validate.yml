name: Repository validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Repository checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund

      - name: Run every test suite
        run: npm test

      - name: Check generated adoption documentation
        run: npm run docs:check

      - name: Type-check
        run: npm run typecheck

      - name: Build CLI
        run: npm run build

      - name: Validate framework
        run: npm run validate -- --framework-only

      - name: Run offline Contoso smoke journey
        run: npm run smoke:contoso

      - name: Run new-contract Copilot smoke journey
        run: npm run smoke:contoso -- --host github-copilot --schema-version 1.1.0

      - name: Run new-contract Claude smoke journey
        run: npm run smoke:contoso -- --host claude-code --schema-version 1.1.0

  validate:
    name: Repository validation
    if: always()
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require both platforms
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
        run: test "$CHECKS_RESULT" = success
