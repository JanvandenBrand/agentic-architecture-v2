name: Repository validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Repository validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund

      - name: Run repository governance tests
        run: npm run test:governance

      - name: Check generated adoption documentation
        run: npm run docs:check

      - name: Run adoption and release tests
        run: npm run test:adoption

      - name: Run contract tests
        run: npm run test:contracts

      - name: Run secure renderer tests
        run: npm run test:renderer

      - name: Run Contoso harness tests
        run: npm run test:smoke

      - name: Type-check
        run: npm run typecheck

      - name: Build CLI
        run: npm run build

      - name: Validate framework
        run: npm run validate -- --framework-only

      - name: Run offline Contoso smoke journey
        run: npm run smoke:contoso
